    <circle cx="140" cy="110" r="240" fill="url(#glowGreen)"/>
    <circle cx="430" cy="450" r="200" fill="url(#glowBlue)"/>

    <!-- Barras: el mercado -->
    <rect x="112" y="300" width="42" height="96" rx="14" fill="#243244" opacity="0.9"/>
    <rect x="180" y="258" width="42" height="138" rx="14" fill="#243244" opacity="0.9"/>
    <rect x="248" y="286" width="42" height="110" rx="14" fill="#243244" opacity="0.9"/>
    <rect x="316" y="214" width="42" height="182" rx="14" fill="#10B981"/>

    <!-- Linea de cuota justa -->
    <path d="M104 268 L201 214 L269 240 L337 158" stroke="#ECFDF5" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="337" cy="158" r="26" fill="#22C55E"/>
    <circle cx="337" cy="158" r="10" fill="#04120C"/>
  </g>
</svg>
